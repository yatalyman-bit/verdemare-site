baseURL = "https://example.com/"   # TODO: il dominio, quando lo compri
languageCode = "en"
title = "Verdemare · Private surf sessions"
disableKinds = ["taxonomy", "term", "RSS"]
enableRobotsTXT = true

[outputs]
  home = ["HTML", "JSON"]

[outputFormats.JSON]
  baseName = "site"

[imaging]
  quality = 82
  resampleFilter = "lanczos"
  [imaging.exif]
    disableLatLong = true

[markup.goldmark.renderer]
  unsafe = false

[menus]
  [[menus.main]]
    name = "Prices"
    pageRef = "/prices"
    weight = 1
  [[menus.main]]
    name = "Work"
    pageRef = "/work"
    weight = 2
  [[menus.main]]
    name = "About"
    pageRef = "/about"
    weight = 3
