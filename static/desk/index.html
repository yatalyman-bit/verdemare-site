<style>
/* Layout: a working desk — sticky top bar with a scrolling tab row, one column of panels; the post generator splits into brief | output on wide screens */
:root{
  --bg:#edf1f0; --surface:#ffffff; --sunk:#e3e9e8; --line:#cfd9d8;
  --ink:#10272b; --muted:#566a6d; --accent:#0d6a70; --accent-ink:#ffffff;
  --signal:#a86d07; --good:#2f7d4f; --warn:#a86d07; --bad:#b23a2e; --chip:#dbe7e6;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1618; --surface:#12201f; --sunk:#0f1b1c; --line:#24393a;
  --ink:#e2ecea; --muted:#93a7a8; --accent:#4bb5b3; --accent-ink:#061213;
  --signal:#e9b448; --good:#5cbf86; --warn:#e9b448; --bad:#ec7a6c; --chip:#1c3132; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1618; --surface:#12201f; --sunk:#0f1b1c; --line:#24393a;
  --ink:#e2ecea; --muted:#93a7a8; --accent:#4bb5b3; --accent-ink:#061213;
  --signal:#e9b448; --good:#5cbf86; --warn:#e9b448; --bad:#ec7a6c; --chip:#1c3132; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1180px;margin:0 auto}
header.bar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top{display:flex;align-items:center;gap:12px;padding-block:10px 4px}
.brand{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px;min-width:0}
.brand small{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .spacer{flex:1}
nav{display:flex;gap:4px;overflow-x:auto;padding-block:4px 8px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{flex:0 0 auto;color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:6px;font-weight:500;font-size:14px}
nav a:hover{color:var(--ink);background:var(--sunk)}
nav a[aria-current="page"]{color:var(--accent-ink);background:var(--accent)}
main{padding-block:20px 60px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:26px} h2{font-size:19px} h3{font-size:16px}
.lede{color:var(--muted);max-width:68ch;margin:6px 0 0}
.stack{display:flex;flex-direction:column;gap:16px}
.grid2{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:18px;align-items:start}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.panel>h2,.panel>h3{margin-bottom:10px}
.label{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 150px;min-width:0}
.check{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
.check input{width:auto}
button{font:inherit;font-size:14px;font-weight:600;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 13px;cursor:pointer}
button:hover{background:var(--sunk)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.primary:hover{filter:brightness(1.08)}
button.small{padding:4px 9px;font-size:12.5px}
button.danger{color:var(--bad);border-color:var(--bad)}
button:disabled{opacity:.5;cursor:default}
.mono{font-family:var(--f-mono);font-size:13px}
.muted{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--ink);white-space:nowrap}
.chip.accent{background:var(--accent);color:var(--accent-ink)}
.chip.warn{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.chip.bad{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.chip.good{background:transparent;border:1px solid var(--good);color:var(--good)}
.tgt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line)}
.tgt:first-of-type{border-top:0}
.tgt .why{grid-column:1/-1;font-size:13px;color:var(--muted)}
.tgt b{font-weight:600}
.score{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.slot{border-left:3px solid var(--accent);padding-left:12px}
.slot.dm{border-left-color:var(--signal)}
.slot.ex{border-left-color:var(--good)}
textarea.out,pre.out{white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:10px;margin:6px 0 0;font-family:var(--f-mono);font-size:13.5px;width:100%}
textarea.out{min-height:150px}
.notice{border:1px solid var(--warn);background:transparent;border-radius:8px;padding:10px 12px;font-size:13.5px}
.notice.info{border-color:var(--line);background:var(--sunk)}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td select{min-width:130px}
.empty{color:var(--muted);font-size:14px;padding:12px 0}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:14px;z-index:20;max-width:calc(100vw - 32px)}
details summary{cursor:pointer;font-weight:600}
.split{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.kpi .v{font-family:var(--f-display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.funnel{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.funnel div{background:var(--sunk);border-radius:8px;padding:8px 10px}
.funnel b{display:block;font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.cand{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.cand:first-child{border-top:0}
.cand.on .cand-main b{color:var(--accent)}
.cand .why{font-size:13px;color:var(--muted);margin-top:2px}
.cand-num{display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-align:right}
.cand-num input{width:112px;text-align:right;font-family:var(--f-mono);padding:5px 8px}
.nlab{font-size:12px;color:var(--muted)} .nage{font-size:11.5px;color:var(--muted)}
.cand-sel{grid-column:1/-1}
@media (min-width:620px){.cand{grid-template-columns:minmax(0,1fr) auto 190px}.cand-sel{grid-column:auto}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
a{color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.sync{font-size:12px;padding:3px 8px;border-radius:99px;background:#e7efe9;color:#2f6b45;margin-right:8px}.sync[data-state=off]{background:#fbeee0;color:#8a4b12}.sync[data-state=busy]{background:#eef1f4;color:#555}
</style>
</head>

function isPaused(t){ return t.status==="pausa" || statsFor(t.id).tagsSincePos>=3 }

/* ---------- ranking ---------- */
function rank(inp){
  const local = PT_SPOTS.some(s=>(inp.spot||"").toLowerCase().includes(s));
  const board = (inp.board||"").toLowerCase();
  const out=[];
  for(const t of list(S.targets)){
    if(isPaused(t)) continue;
    const ns=t.niches||[]; let sc=0; const why=[];
    if(ns.includes(inp.niche)){sc+=6; why.push("nicchia "+NICHES[inp.niche])}
    else if((RELATED[inp.niche]||[]).some(n=>ns.includes(n))){sc+=2; why.push("nicchia vicina")}
    else continue;
    if(inp.female && ns.includes("femminile") && inp.niche!=="femminile"){sc+=3; why.push("surfista donna")}
    const strong = inp.strength==="eccezionale";
    if(t.tier==="internazionale"){ sc += strong?3:-2; if(strong) why.push("foto eccezionale: si punta in alto") }
    if(t.tier==="europa"){ sc += 2 }
    if(t.tier==="locale"){ sc += local?4:0; if(local) why.push("spot portoghese") }
    if(t.type==="brand"){
      const words = (t.matchWords&&t.matchWords.length)? t.matchWords : [t.name];
      if(words.some(w=>w && board && board.includes(w.toLowerCase()))){sc+=6; why.push("si vede la loro tavola o muta")} else sc-=3;
    }
    const st=statsFor(t.id);
    if(st.lastTag && daysAgo(st.lastTag)<14){sc-=4; why.push("taggato "+daysAgo(st.lastTag)+" giorni fa")}
    if(st.reposts+st.replies>0){sc+=1; why.push("ha già interagito")}
    out.push({t,sc,why});
  }
  return out.sort((a,b)=>b.sc-a.sc);
}
function plan(inp){
  const r = rank(inp);
  const editorial = r.filter(x=>["magazine","repost","evento","piattaforma"].includes(x.t.type));
  const brands = r.filter(x=>x.t.type==="brand" && x.sc>=8);
  let tagFoto=[], dm=[], exclusive=[];
  if(inp.unpublished){
    exclusive = editorial.filter(x=>x.t.submission).slice(0,2);
  } else {
    const mags = editorial.filter(x=>x.t.type==="magazine");
    if(mags[0]) tagFoto.push(mags[0]);
    for(const x of editorial){ if(tagFoto.length>=3) break; if(!tagFoto.includes(x)) tagFoto.push(x) }
    if(brands[0]) tagFoto.push(brands[0]);
    dm = editorial.filter(x=>!tagFoto.includes(x) && (x.t.submission||x.t.email)).slice(0,2);
  }
  // candidates the viewer chooses from: the picks first, then the next best matches
  const picks=[...tagFoto,...dm,...exclusive];
  const cands=[...picks, ...r.filter(x=>!picks.includes(x) && (x.t.type!=="brand" || x.sc>=4))].slice(0, Math.max(10,picks.length));
  const sel={}; for(const x of tagFoto) sel[x.t.id]="tag"; for(const x of dm) sel[x.t.id]="dm"; for(const x of exclusive) sel[x.t.id]="ex";
  const hashtags=pickTags(inp);
  return {tagFoto,dm,exclusive,cands,sel,hashtags,tagCands:hashtagCands(inp,hashtags),tagSel:new Set(hashtags)};
}
function hashtagCands(inp,chosen){
  const spot=(inp.spot||"").toLowerCase(); const local=PT_SPOTS.some(s=>spot.includes(s)); const used=tagUse();
  const order={locale:0,nicchia:1,medio:2,grande:3};
  const fit = h => !h.avoid && ( (h.niches||[]).includes(inp.niche) || (RELATED[inp.niche]||[]).some(n=>(h.niches||[]).includes(n))
    || ((h.niches||[]).includes("tutte") && (h.size!=="locale" || (h.spots? h.spots.some(s=>spot.includes(s)) : local))) );
  const rest = list(S.hashtags).filter(h=>!chosen.includes(h.tag) && fit(h))
    .sort((a,b)=>(order[a.size]-order[b.size]) || (used[a.tag]||"").localeCompare(used[b.tag]||""));
  const byTag = {}; for(const h of list(S.hashtags)) byTag[h.tag]=h;
  return [...chosen.map(t=>byTag[t]).filter(Boolean), ...rest].slice(0,14);
}
function tagWhy(h,inp){
  const spot=(inp.spot||"").toLowerCase(); const used=tagUse()[h.tag];
  const w=[];
  if(h.size==="locale") w.push(h.spots&&h.spots.some(s=>spot.includes(s))?"dello spot":"locale");
  if((h.niches||[]).includes(inp.niche)) w.push("nicchia");
  w.push({grande:"molto usato: tanta concorrenza",medio:"uso medio",nicchia:"di nicchia: pubblico mirato",locale:"pubblico vicino"}[h.size]||"");
  if(used) w.push(`usato l'ultima volta il ${used}`);
  return w.filter(Boolean).join(" · ");
}

/* ---------- hashtags ---------- */
function tagUse(){const u={};for(const p of list(S.posts)){if(p.status!=="pubblicato")continue;for(const h of p.hashtags||[]){const d=p.publishedAt||p.date||"";if(!u[h]||d>u[h])u[h]=d}}return u}
function pickTags(inp){
  const used=tagUse(); const spot=(inp.spot||"").toLowerCase(); const pool=list(S.hashtags);
  const fresh = arr => arr.slice().sort((a,b)=>(used[a.tag]||"").localeCompare(used[b.tag]||""));
  const mine = n => pool.filter(h=>(h.niches||[]).includes(n));
  const chosen=[];
  const take=(arr,k)=>{for(const h of fresh(arr)){if(chosen.length>=5||k<=0)break;if(!chosen.includes(h)&&!h.avoid){chosen.push(h);k--}}};
  take(pool.filter(h=>h.size==="locale" && h.spots && h.spots.some(s=>spot.includes(s))).sort((a,b)=>a.spots.length-b.spots.length),1);
  take(mine(inp.niche).filter(h=>h.size==="nicchia"),2);
  take(mine(inp.niche).filter(h=>h.size==="medio"),1);
  take(pool.filter(h=>h.size==="grande" && ((h.niches||[]).includes(inp.niche)||(h.niches||[]).includes("tutte"))),1);
  take(mine(inp.niche),5);
  take(pool.filter(h=>h.size==="locale" && PT_SPOTS.some(s=>spot.includes(s)) && !h.spots),5);
  return chosen.map(h=>h.tag);
}

function clientNudge(){
  const pub = list(S.posts).filter(p=>p.status==="pubblicato").sort((a,b)=>(b.publishedAt||"").localeCompare(a.publishedAt||"")).slice(0,6);
  if(pub.length<4 || pub.some(p=>p.niche==="cliente")) return "";
  return `<div class="notice">Negli ultimi ${pub.length} post non c'è nessuna sessione cliente. Un post o una storia con un cliente intermedio fa capire a chi ti segue che può prenotarti.</div>`;
}

   <td><div class="chips">${(h.niches||[]).map(n=>`<span class="chip">${NICHES[n]||esc(n)}</span>`).join("")}</div></td>
   <td class="num"><input type="number" min="0" step="1000" data-hc="${h.id}" value="${h.posts??""}" placeholder="?" style="width:120px" inputmode="numeric" aria-label="Numero di post per ${esc(h.tag)}"></td>
   <td class="mono">${esc(h.checked||"mai")}${h.posts?`<br><span class="muted">${fmtN(h.posts)}</span>`:""}</td><td class="mono">${esc(used[h.tag]||"—")}</td>
   <td><button class="small" data-hdel="${h.id}">Elimina</button></td></tr>`).join("")}
  </tbody></table></div></div></div>`;
}

  <form class="panel stack" id="f-p"><h2>Aggiungi una persona</h2>

   <label>Liberatoria<select id="p-rel"><option value="no">Non firmata</option><option value="attesa">In attesa</option><option value="si">Firmata</option></select></label></div>

  ${ps.map(p=>`<tr><td><b>${esc(p.name)}</b><br><span class="mono muted">${esc(p.handle||"")}</span></td>
   <td><select data-rel="${p.id}" aria-label="Liberatoria di ${esc(p.name)}">${opts({no:"Non firmata",attesa:"In attesa",si:"Firmata"},p.release)}</select></td>

  </tbody></table></div></div></div>`;
}

/* RISULTATI */
function vRisultati(){
  const rows=list(S.targets).map(t=>({t,s:statsFor(t.id)})).filter(r=>r.s.ev.length).sort((a,b)=>(b.s.reposts*3+b.s.replies*2+b.s.jobs*5)-(a.s.reposts*3+a.s.replies*2+a.s.jobs*5));
  const pub=list(S.posts).filter(p=>p.status==="pubblicato");
  const byN={}; for(const p of pub){byN[p.niche]=(byN[p.niche]||0)+1}
  const tot=k=>rows.reduce((a,r)=>a+r.s[k],0);
  const bk=list(S.bookings); const byP={};
  for(const b of bk){const k=b.partnerId||"_";(byP[k]=byP[k]||{n:0,tot:0,c:0});byP[k].n++;byP[k].tot+=(b.pkg||0)+(b.extra||0);byP[k].c+=b.commission||0}
  return `<div class="stack"><div><h1>Risultati</h1><p class="lede">Quali account e quali partner ti portano risultati. Investi il tempo su quelli in cima.</p></div>
  <div class="panel"><h2>Instagram</h2><div class="kpis">${[["Post pubblicati",pub.length],["Tag",tot("tags")],["DM ed email",tot("dms")],["Risposte",tot("replies")],["Repost",tot("reposts")],["Lavori",tot("jobs")]].map(([l,v])=>`<div class="kpi"><div class="label">${l}</div><div class="v">${v}</div></div>`).join("")}</div></div>
  <div class="panel"><h2>Per account</h2><div class="table-wrap"><table><thead><tr><th>Account</th><th class="num">Tag</th><th class="num">DM</th><th class="num">Risposte</th><th class="num">Repost</th><th class="num">Alta ris.</th><th class="num">Lavori</th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td>${esc(r.t.name)}${isPaused(r.t)?' <span class="chip bad">pausa</span>':""}</td>${["tags","dms","replies","reposts","hires","jobs"].map(k=>`<td class="num">${r.s[k]}</td>`).join("")}</tr>`).join("")||'<tr><td colspan="7" class="empty">I numeri compaiono quando inizi a registrare tag e messaggi.</td></tr>'}
  </tbody></table></div></div>
  <div class="panel"><h2>Sessioni per canale</h2><div class="table-wrap"><table><thead><tr><th>Canale</th><th class="num">Sessioni</th><th class="num">Incasso</th><th class="num">Commissioni</th><th class="num">Netto</th></tr></thead><tbody>
  ${Object.entries(byP).sort((a,b)=>b[1].tot-a[1].tot).map(([k,v])=>`<tr><td>${k==="_"?"Diretto":esc(S.partners[k]?.name||"?")}</td><td class="num">${v.n}</td><td class="num">${eur(v.tot)}</td><td class="num">${eur(v.c)}</td><td class="num">${eur(v.tot-v.c)}</td></tr>`).join("")||'<tr><td colspan="5" class="empty">Registra le sessioni in Partner per vedere da dove arrivano i clienti.</td></tr>'}
  </tbody></table></div></div>
  <div class="panel"><h2>Post per nicchia</h2><div class="chips">${Object.entries(NICHES).map(([k,v])=>`<span class="chip">${v}: ${byN[k]||0}</span>`).join("")}</div></div></div>`;
}

/* IMPOSTAZIONI */
function vImpostazioni(){
  const pr=S.profile||{};
  const n={}; for(const c of COLS) n[c]=list(S[c]).length;
  return `<div class="stack"><div><h1>Impostazioni</h1><p class="lede">L'app non usa account né server: tutto resta su questo dispositivo. Per passare i dati da un telefono a un computer, esporta il backup e importalo sull'altro.</p></div>
  ${storageOk?"":'<div class="notice">Questo browser non mi lascia salvare i dati: forse sei in navigazione privata. Apri l\'app in una finestra normale.</div>'}
  <form class="panel stack" id="f-pr"><h2>Profilo</h2>
   <div class="row"><label>Nome del brand<input id="pr-brand" value="${esc(pr.brand||"")}"></label><label>Handle Instagram<input id="pr-handle" value="${esc(pr.handle||"")}"></label><label>Base<input id="pr-base" value="${esc(pr.base||"")}"></label></div>
   <div><button class="primary" type="submit">Salva profilo</button></div></form>
  <div class="panel stack"><h2>Backup</h2>
   <p class="muted" style="margin:0">Sul dispositivo: ${n.targets} account, ${n.partners} partner, ${n.posts} post, ${n.log} contatti, ${n.bookings} sessioni, ${n.people} persone, ${n.hashtags} hashtag. Ultimo backup: ${esc(S.meta.lastExport||"mai")}.</p>
   <div class="row" style="flex-wrap:wrap"><button class="primary" id="exp" style="flex:0 0 auto">Esporta backup</button>
    <label style="flex:0 0 auto;align-self:center"><span class="muted">Importa un backup</span><input type="file" id="imp" accept="application/json,.json"></label></div>
   <p class="muted" style="margin:0;font-size:13px">L'importazione sostituisce i dati di questo dispositivo con quelli del file.</p>
   <p id="persist" class="muted" style="margin:0;font-size:13px"></p>
  </div>
  <div class="panel stack"><h2>Installa sul telefono</h2>
   <p style="margin:0">Android (Chrome): menu ⋮ e poi <b>Installa app</b>. Chrome la installa come un'app vera, con l'icona e senza barra del browser. Funziona anche offline.</p>
   <p style="margin:0">iPhone (Safari): tasto Condividi e poi <b>Aggiungi alla schermata Home</b>.</p></div>
  <div class="panel stack"><h2>Azzera</h2><p class="muted" style="margin:0">Cancella tutti i dati, anche quelli online, e riparte dall'elenco iniziale. Esporta prima un backup.</p><div><button class="danger" id="reset">Cancella tutto</button></div></div>
  </div>`;
}

/* ---------- bindings ---------- */
function bind(v){
  document.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>copyEl($("#"+b.dataset.copy)));
  if(v==="nuovo"){
    $("#f-brief").onsubmit=e=>{e.preventDefault(); const inp=readDraft(); if(!inp.desc){toast("Scrivi una descrizione della foto");$("#b-desc").focus();return}
      lastOut={inp,pl:plan(inp)}; $("#out").innerHTML=outHtml(lastOut); bindOut(); if(innerWidth<860) $("#out").scrollIntoView({behavior:"smooth"})};
    bindOut();
  }
  if(v==="coda"){
    document.querySelectorAll("[data-pub]").forEach(b=>b.onclick=()=>{const p=S.posts[b.dataset.pub]; if(!p) return; const d=today();
      if(p.status==="inedita"){ for(const id of p.exclusiveTargets||[]) S.log[newId("l")]={targetId:id,kind:"email",date:d,outcome:"inviato",postId:p.id,note:"Proposta in esclusiva"} }
      else { for(const id of p.tagTargets||[]) S.log[newId("l")]={targetId:id,kind:"tag",date:d,outcome:"inviato",postId:p.id};
             for(const id of p.dmTargets||[]) S.log[newId("l")]={targetId:id,kind:"dm",date:d,outcome:"inviato",postId:p.id} }
      for(const id in S.log) if(!S.log[id].id) S.log[id].id=id;
      toast(p.status==="inedita"?"Proposta registrata":"Pubblicato: tag e DM registrati");
      patch("posts",p.id,{status:"pubblicato",publishedAt:d})});
    document.querySelectorAll("[data-delpost]").forEach(b=>armDelete(b,()=>del("posts",b.dataset.delpost)));
  }
  if(v==="contatti"){
    document.querySelectorAll("[data-oc]").forEach(s=>s.onchange=()=>patch("log",s.dataset.oc,{outcome:s.value}));
    document.querySelectorAll("[data-fu]").forEach(b=>b.onclick=()=>{const e=S.log[b.dataset.fu]; const id=newId("l"); S.log[e.id]={...e,followed:true};
      S.log[id]={id,targetId:e.targetId,kind:e.kind,date:today(),outcome:"inviato",followed:true,note:"Follow-up"}; save(); toast("Follow-up registrato"); route()});
    $("#f-log").onsubmit=e=>{e.preventDefault(); if(!$("#l-t").value) return; const id=newId("l");
      put("log",id,{id,targetId:$("#l-t").value,kind:$("#l-k").value,date:$("#l-d").value||today(),outcome:"inviato",note:$("#l-n").value.trim()}); toast("Registrato")};
  }
  if(v==="partner"){
    document.querySelectorAll("[data-ph]").forEach(s=>s.onchange=()=>{const up={phase:s.value}; if(["contattato","incontro"].includes(s.value)) up.lastContact=today(); patch("partners",s.dataset.ph,up)});
    document.querySelectorAll("[data-pc]").forEach(b=>b.onclick=()=>{const p=S.partners[b.dataset.pc]; patch("partners",p.id,{lastContact:today(),phase:p.phase==="dacontattare"?"contattato":p.phase}); toast("Registrato: follow-up tra 5 giorni")});
    document.querySelectorAll("[data-pmsg]").forEach(b=>b.onclick=()=>{showMsg = showMsg===b.dataset.pmsg? null : b.dataset.pmsg; route()});
    document.querySelectorAll("[data-pedit]").forEach(b=>b.onclick=()=>{editP=b.dataset.pedit; route(); $("#f-pt").scrollIntoView({behavior:"smooth"})});
    document.querySelectorAll("[data-paid]").forEach(b=>b.onclick=()=>{const [m,pid]=b.dataset.paid.split("|"); for(const k in S.bookings){const x=S.bookings[k]; if(x.partnerId===pid && month(x.date)===m) S.bookings[k]={...x,paid:true}} save(); toast("Commissione segnata come pagata"); route()});
    document.querySelectorAll("[data-bdel]").forEach(b=>armDelete(b,()=>del("bookings",b.dataset.bdel)));
    const hint=()=>{const p=S.partners[$("#k-p").value]; const a=+$("#k-a").value||0; $("#k-hint").textContent = p? `Commissione per ${p.name}: ${p.pct||0}% di ${eur(a)} = ${eur(a*(p.pct||0)/100)}. Gli extra restano tuoi.` : "Cliente diretto: nessuna commissione."};
    $("#k-pk").onchange=()=>{const pk=PACKAGES[$("#k-pk").value]; if(pk&&pk[1]) $("#k-a").value=pk[1]; hint()};
    $("#k-p").onchange=hint; $("#k-a").oninput=hint; hint();
    $("#f-bk").onsubmit=e=>{e.preventDefault(); const p=S.partners[$("#k-p").value]; const a=Math.max(0,+$("#k-a").value||0); const id=newId("b");
      put("bookings",id,{id,date:$("#k-d").value||today(),partnerId:p?p.id:"",package:$("#k-pk").value,pkg:a,extra:Math.max(0,+$("#k-x").value||0),pct:p?(p.pct||0):0,commission:p?Math.round(a*(p.pct||0))/100:0,client:$("#k-c").value.trim(),paid:false});
      toast("Sessione registrata")};
    const c=$("#pt-cancel"); if(c) c.onclick=()=>{editP=null;route()};
    const d=$("#pt-del"); if(d) armDelete(d,()=>{const id=editP; editP=null; del("partners",id)});
    $("#f-pt").onsubmit=e=>{e.preventDefault(); const name=$("#pt-name").value.trim(); if(!name) return;
      const id=editP||("p-"+name.toLowerCase().replace(/[^a-z0-9]+/g,"-").slice(0,30)+"-"+Date.now().toString(36).slice(-3)); const old=S.partners[id]||{};
      const phase=$("#pt-phase").value;
      const rec={...old,id,name,zone:$("#pt-zone").value.trim(),type:$("#pt-type").value,prio:$("#pt-prio").value,phase,why:$("#pt-why").value.trim(),person:$("#pt-person").value.trim(),
        email:$("#pt-email").value.trim(),phone:$("#pt-phone").value.trim(),url:$("#pt-url").value.trim(),code:$("#pt-code").value.trim().toUpperCase(),pct:Math.max(0,+$("#pt-pct").value||0),
        notes:$("#pt-notes").value.trim(),verified:today()};
      if(phase!==old.phase && ["contattato","incontro"].includes(phase)) rec.lastContact=today();
      editP=null; put("partners",id,rec); toast("Salvato")};
  }
  if(v==="database"){
    document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{editT=b.dataset.edit;route();scrollTo({top:0})});
    document.querySelectorAll("[data-pause]").forEach(b=>b.onclick=()=>{const t=S.targets[b.dataset.pause];patch("targets",t.id,{status:t.status==="pausa"?"attivo":"pausa"})});
    const c=$("#t-cancel"); if(c) c.onclick=()=>{editT=null;route()};
    const d=$("#t-del"); if(d) armDelete(d,()=>{const id=editT; editT=null; del("targets",id)});
    $("#f-t").onsubmit=e=>{e.preventDefault(); const name=$("#t-name").value.trim(); if(!name) return;
      const id=editT||("t-"+name.toLowerCase().replace(/[^a-z0-9]+/g,"-").slice(0,40)+"-"+Date.now().toString(36).slice(-3)); const old=S.targets[id]||{};
      editT=null;
      put("targets",id,{...old,id,name,handle:$("#t-handle").value.trim(),type:$("#t-type").value,tier:$("#t-tier").value,lang:$("#t-lang").value,
        niches:[...document.querySelectorAll(".t-n:checked")].map(x=>x.value),url:$("#t-url").value.trim(),email:$("#t-email").value.trim(),submission:$("#t-sub").value.trim(),fit:$("#t-fit").value.trim(),
        matchWords:$("#t-match").value.split(",").map(s=>s.trim()).filter(Boolean),notes:$("#t-notes").value.trim(),handleVerified:$("#t-hv").checked,verified:today(),status:old.status||"attivo",
        followers:$("#t-fol").value===""?null:Number($("#t-fol").value),followersChecked:($("#t-fol").value!==String(old.followers??""))?today():(old.followersChecked||null)});
      toast("Salvato")};
  }
  if(v==="hashtag"){
    document.querySelectorAll("[data-hc]").forEach(i=>i.onchange=()=>patch("hashtags",i.dataset.hc,{posts:i.value===""?null:Number(i.value),checked:today()}));
    document.querySelectorAll("[data-hdel]").forEach(b=>armDelete(b,()=>del("hashtags",b.dataset.hdel)));
    $("#f-h").onsubmit=e=>{e.preventDefault(); let tag=$("#h-tag").value.trim().replace(/\s+/g,"").toLowerCase(); if(!tag) return; if(!tag.startsWith("#")) tag="#"+tag;
      const id="h-"+tag.slice(1).replace(/[^a-z0-9]/g,""); put("hashtags",id,{id,tag,size:$("#h-size").value,niches:[$("#h-n").value],posts:null,checked:null}); toast("Aggiunto")};
  }
  if(v==="persone"){
    document.querySelectorAll("[data-rel]").forEach(s=>s.onchange=()=>patch("people",s.dataset.rel,{release:s.value}));
    document.querySelectorAll("[data-pdel]").forEach(b=>armDelete(b,()=>del("people",b.dataset.pdel)));
    $("#f-p").onsubmit=e=>{e.preventDefault(); const name=$("#p-name").value.trim(); if(!name) return; const id=newId("p");
      put("people",id,{id,name,handle:$("#p-handle").value.trim(),release:$("#p-rel").value,share:$("#p-share").value.trim(),notes:$("#p-notes").value.trim()}); toast("Aggiunta")};
  }
  if(v==="impostazioni"){
    $("#f-pr").onsubmit=e=>{e.preventDefault(); S.profile={...S.profile,_u:now(),brand:$("#pr-brand").value.trim(),handle:$("#pr-handle").value.trim(),base:$("#pr-base").value.trim()}; save(); toast("Profilo salvato"); route()};
    $("#exp").onclick=()=>{ const data=JSON.stringify({app:"verdemare-desk",exported:new Date().toISOString(),...S},null,1);
      const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([data],{type:"application/json"})); a.download="verdemare-backup-"+today()+".json"; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
      S.meta.lastExport=today(); save(); toast("Backup esportato"); route() };
    $("#imp").onchange=async e=>{ const f=e.target.files[0]; if(!f) return;
      try{ const d=JSON.parse(await f.text()); if(d.app!=="verdemare-desk") throw new Error("not ours");
        const t=now(); for(const c of COLS){ S[c]=d[c]||{}; for(const k in S[c]) S[c][k]={...S[c][k],_u:t} } S.profile={...(d.profile||{}),_u:t}; S.meta={...(d.meta||{}),lastExport:S.meta.lastExport,deleted:{}}; mergeSeed(); save(); toast("Backup importato"); route() }
      catch(err){ toast("Il file non è un backup di Verdemare Desk") } };
    armDelete($("#reset"),()=>{ const t=now(), gone={}; for(const c of COLS) for(const id in S[c]) gone[c+"/"+id]=t;
  S={targets:{},hashtags:{},log:{},posts:{},people:{},partners:{},bookings:{},profile:{},meta:{deleted:gone}}; mergeSeed();
  for(const c of COLS) for(const id in S[c]) S[c][id]={...S[c][id],_u:t+1}; S.profile={...S.profile,_u:t+1}; save(); toast("Dati cancellati"); route() });
    const pe=$("#persist"); if(navigator.storage&&navigator.storage.persisted){ navigator.storage.persisted().then(ok=>{ pe.textContent = ok? "Il browser tiene questi dati al sicuro e non li cancella da solo." : "Il browser potrebbe cancellare i dati se manca spazio: installa l'app e fai backup regolari." }) }
  }
}
function refreshOut(){
  const o=lastOut; if(!o) return; const s=selected(o);
  $("#o-count").innerHTML=countsHtml(o);
  $("#o-tags").value=s.tags.join(" ");
  $("#o-msgs").innerHTML=msgsHtml(o);
  const cap=$("#o-cap"); if(cap) cap.value=captionTemplate(o.inp,s.tag,s.tags);
  document.querySelectorAll("#o-msgs [data-copy]").forEach(b=>b.onclick=()=>copyEl($("#"+b.dataset.copy)));
}
function bindOut(){
  const o=lastOut; if(!o) return;
  document.querySelectorAll("#out [data-copy]").forEach(b=>b.onclick=()=>copyEl($("#"+b.dataset.copy)));
  document.querySelectorAll("#out [data-sel]").forEach(s=>s.onchange=()=>{ o.pl.sel[s.dataset.sel]=s.value; s.closest(".cand").classList.toggle("on",!!s.value); refreshOut() });
  document.querySelectorAll("#out [data-tg]").forEach(c=>c.onchange=()=>{ if(c.checked) o.pl.tagSel.add(c.dataset.tg); else o.pl.tagSel.delete(c.dataset.tg); c.closest(".cand").classList.toggle("on",c.checked); refreshOut() });
  document.querySelectorAll("#out [data-fol]").forEach(i=>i.onchange=()=>{ quiet("targets",i.dataset.fol,{followers:i.value===""?null:Number(i.value),followersChecked:today()});
    const c=i.closest(".cand-num"); c.querySelector(".nage").textContent=ageNote(today()); c.querySelector(".nlab").textContent=i.value===""?"follower: scrivili tu":"follower"; toast("Follower salvati") });
  document.querySelectorAll("#out [data-hc2]").forEach(i=>i.onchange=()=>{ quiet("hashtags",i.dataset.hc2,{posts:i.value===""?null:Number(i.value),checked:today()});
    const c=i.closest(".cand-num"); c.querySelector(".nage").textContent=ageNote(today()); c.querySelector(".nlab").textContent=i.value===""?"post: scrivili tu":"post"; toast("Salvato") });
  $("#save-post").onclick=()=>{const id=newId("post");const i=o.inp; const s=selected(o);
    if(!i.unpublished && !s.tag.length && !s.dm.length){ toast("Scegli almeno un account da taggare o a cui scrivere"); return }
    put("posts",id,{id,date:today(),status:i.unpublished?"inedita":"idea",niche:i.niche,spot:i.spot,desc:i.desc,conditions:i.conditions,board:i.board,people:i.people,
      tagTargets:s.tag.map(t=>t.id),dmTargets:s.dm.map(t=>t.id),exclusiveTargets:s.ex.map(t=>t.id),hashtags:($("#o-tags")?.value||"").split(/\s+/).filter(Boolean),
      caption:i.unpublished?"":($("#o-cap")?.value||"")});
    toast("Salvato in coda"); lastOut=null; draft={...draft,desc:"",spot:"",conditions:"",board:"",people:[]}; location.hash="#coda"};
}

/* ---------- boot ---------- */
load();
window.addEventListener("hashchange",()=>{route()});
route();
if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
  if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
}
let installEvt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault(); installEvt=e; $("#install").hidden=false});
$("#install").onclick=async()=>{ if(!installEvt) return; installEvt.prompt(); try{await installEvt.userChoice}catch(e){} installEvt=null; $("#install").hidden=true };
</script>
</body>
